[package]
name = "copykitten"
version = "2.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "copykitten"
crate-type = ["cdylib"]

[dependencies]
arboard = "3.7.0"
clipboard-master = "4.0.0"
log = "0.4.34"
pyo3 = { version =  "0.29.3", features = ["extension-module", "abi3-py310"] }
pyo3-log = "0.13.4"

[target.'cfg(target_os = "linux")'.dependencies]
daemonize = "0.5.0"

[profile.release]
strip = "symbols"
