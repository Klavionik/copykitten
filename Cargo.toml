[package]
name = "copykitten"
version = "2.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "copykitten"
crate-type = ["cdylib"]

[dependencies]
arboard = "3.7.0"
pyo3 = { version =  "0.30.1", features = ["extension-module", "abi3-py310"] }

[target.'cfg(target_os = "linux")'.dependencies]
daemonize = "0.5.0"

[profile.release]
strip = "symbols"
