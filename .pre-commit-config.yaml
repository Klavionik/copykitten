# See https://prek.j178.dev/ for more information
repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        types: [text]
      - id: end-of-file-fixer
        types: [text]
      - id: requirements-txt-fixer
      - id: mixed-line-ending

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo-fmt
        stages:
          - commit
        entry: cargo fmt
        language: system
        types: [rust]
        args:
          - "--"

      - id: cargo-fmt-check
        name: cargo-fmt-check
        stages:
          - manual
        entry: cargo fmt --check
        language: system
        types: [rust]
        args:
          - "--"

      - id: cargo-check
        name: cargo-check
        entry: cargo check
        language: system
        types: [rust]
        pass_filenames: false

      - id: clippy
        name: clippy
        entry: cargo clippy
        language: system
        args:
          - "--"
          - "-D"
          - "warnings"
        types: [rust]
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        name: ruff fix
        args:
          - --fix
          - --target-version=py310
        stages:
          - commit

      - id: ruff-check
        name: ruff check
        args:
          - --target-version=py310
        stages:
          - manual

      - id: ruff-format
        name: ruff fmt
        args:
          - --target-version=py310
        stages:
          - commit

      - id: ruff-format
        name: ruff fmt check
        args:
          - --check
          - --diff
          - --target-version=py310
        stages:
          - manual

  - repo: https://github.com/jendrikseipp/vulture
    rev: 'v2.11'
    hooks:
      - id: vulture
