name: Lint

on:
  workflow_dispatch:
  push:
    branches:
      - "*"
  pull_request:

jobs:
  lint:
    name: Run linters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: "--all-files --hook-stage manual"
