[build-system]
requires = ["maturin>=1.3,<2.0"]
build-backend = "maturin"

[project]
name = "copykitten"
description = "A robust, dependency-free way to use the system clipboard in Python."
authors = [{ name = "Roman Vlasenko", email = "klavionik@gmail.com" }]
readme = "README.md"
homepage = "https://github.com/Klavionik/copykitten"
license = "MIT"
keywords = ["clipboard"]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dynamic = ["version"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B", "I"]

[tool.vulture]
paths = ["python", "tests"]
min_confidence = 100

[tool.maturin]
python-source = "python"
module-name = "copykitten._copykitten"
