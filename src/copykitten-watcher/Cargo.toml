[package]
name = "copykitten-watcher"
version = "2.1.0"
edition = "2024"

[dependencies]
flexi_logger = "0.31.10"
log = "0.4.34"
chrono = { version = "0.4.45", default-features = false, features = ["std", "now"] }
anyhow = "1.0.104"

[target.'cfg(windows)'.dependencies]
windows = { version =  "0.62.2" , features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader",  "Win32_Graphics_Gdi"]}

[target.'cfg(all(unix, not(any(target_os="macos", target_os="android", target_os="emscripten"))))'.dependencies]
x11rb = { version = "0.14.0", features = ["xfixes"] }
